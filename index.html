<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Space Raiders</title>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      background: #050510;
      color: white;
      font-family: Arial, sans-serif;
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
      overflow: hidden;
    }

    #gameContainer {
      position: relative;
    }

    canvas {
      background: linear-gradient(#03030d, #080824);
      border: 2px solid #4b4b8f;
      box-shadow: 0 0 30px rgba(100, 100, 255, 0.35);
    }

    #instructions {
      position: absolute;
      top: 12px;
      left: 12px;
      font-size: 14px;
      color: #ddd;
    }
  </style>
</head>

<body>

  <div id="gameContainer">
    <canvas id="game" width="600" height="800"></canvas>
    <div id="instructions">
      Move: WASD / Arrow Keys | Shoot: Space
    </div>
  </div>

  <script>
    const canvas = document.getElementById("game");
    const ctx = canvas.getContext("2d");

    const keys = {};

    let score = 0;
    let gameOver = false;

    const player = {
      x: canvas.width / 2 - 20,
      y: canvas.height - 80,
      width: 40,
      height: 50,
      speed: 6,
      health: 3
    };

    const bullets = [];
    const enemies = [];
    const enemyBullets = [];
    const stars = [];

    for (let i = 0; i < 100; i++) {
      stars.push({
        x: Math.random() * canvas.width,
        y: Math.random() * canvas.height,
        size: Math.random() * 2 + 1,
        speed: Math.random() * 2 + 0.5
      });
    }

    document.addEventListener("keydown", (event) => {
      keys[event.key.toLowerCase()] = true;

      if (event.code === "Space") {
        shoot();
      }
    });

    document.addEventListener("keyup", (event) => {
      keys[event.key.toLowerCase()] = false;
    });

    function shoot() {
      if (gameOver) return;

      bullets.push({
        x: player.x + player.width / 2 - 3,
        y: player.y,
        width: 6,
        height: 18,
        speed: 9
      });
    }

    function createEnemy() {
      enemies.push({
        x: Math.random() * (canvas.width - 45),
        y: -60,
        width: 45,
        height: 45,
        speed: 2 + Math.random() * 2,
        shootTimer: Math.random() * 100
      });
    }

    setInterval(() => {
      if (!gameOver) {
        createEnemy();
      }
    }, 1000);

    function drawStars() {
      ctx.fillStyle = "white";

      stars.forEach((star) => {
        ctx.fillRect(star.x, star.y, star.size, star.size);

        star.y += star.speed;

        if (star.y > canvas.height) {
          star.y = 0;
          star.x = Math.random() * canvas.width;
        }
      });
    }

    function drawPlayer() {
      ctx.fillStyle = "#3ee6ff";

      ctx.beginPath();
      ctx.moveTo(player.x + player.width / 2, player.y);
      ctx.lineTo(player.x, player.y + player.height);
      ctx.lineTo(player.x + player.width / 2, player.y + 38);
      ctx.lineTo(player.x + player.width, player.y + player.height);
      ctx.closePath();
      ctx.fill();

      ctx.fillStyle = "#ff6b35";

      ctx.beginPath();
      ctx.moveTo(player.x + 12, player.y + 45);
      ctx.lineTo(player.x + 18, player.y + 65);
      ctx.lineTo(player.x + 22, player.y + 45);
      ctx.fill();

      ctx.beginPath();
      ctx.moveTo(player.x + 22, player.y + 45);
      ctx.lineTo(player.x + 28, player.y + 65);
      ctx.lineTo(player.x + 32, player.y + 45);
      ctx.fill();
    }

    function updatePlayer() {
      if (keys["a"] || keys["arrowleft"]) {
        player.x -= player.speed;
      }

      if (keys["d"] || keys["arrowright"]) {
        player.x += player.speed;
      }

      if (keys["w"] || keys["arrowup"]) {
        player.y -= player.speed;
      }

      if (keys["s"] || keys["arrowdown"]) {
        player.y += player.speed;
      }

      player.x = Math.max(0, Math.min(canvas.width - player.width, player.x));
      player.y = Math.max(0, Math.min(canvas.height - player.height, player.y));
    }

    function drawBullets() {
      ctx.fillStyle = "#00ff9d";

      for (let i = bullets.length - 1; i >= 0; i--) {
        const bullet = bullets[i];

        bullet.y -= bullet.speed;

        ctx.fillRect(
          bullet.x,
          bullet.y,
          bullet.width,
          bullet.height
        );

        if (bullet.y < -20) {
          bullets.splice(i, 1);
        }
      }
    }

    function drawEnemies() {
      for (let i = enemies.length - 1; i >= 0; i--) {
        const enemy = enemies[i];

        enemy.y += enemy.speed;
        enemy.shootTimer++;

        ctx.fillStyle = "#ff3b5c";

        ctx.beginPath();
        ctx.moveTo(enemy.x + enemy.width / 2, enemy.y + enemy.height);
        ctx.lineTo(enemy.x, enemy.y);
        ctx.lineTo(enemy.x + enemy.width / 2, enemy.y + 12);
        ctx.lineTo(enemy.x + enemy.width, enemy.y);
        ctx.closePath();
        ctx.fill();

        if (enemy.shootTimer > 120) {
          enemyBullets.push({
            x: enemy.x + enemy.width / 2 - 4,
            y: enemy.y + enemy.height,
            width: 8,
            height: 14,
            speed: 4
          });

          enemy.shootTimer = 0;
        }

        if (enemy.y > canvas.height) {
          enemies.splice(i, 1);
        }
      }
    }

    function drawEnemyBullets() {
      ctx.fillStyle = "#ff5555";

      for (let i = enemyBullets.length - 1; i >= 0; i--) {
        const bullet = enemyBullets[i];

        bullet.y += bullet.speed;

        ctx.beginPath();
        ctx.arc(
          bullet.x,
          bullet.y,
          6,
          0,
          Math.PI * 2
        );
        ctx.fill();

        if (bullet.y > canvas.height) {
          enemyBullets.splice(i, 1);
        }
      }
    }

    function collision(a, b) {
      return (
        a.x < b.x + b.width &&
        a.x + a.width > b.x &&
        a.y < b.y + b.height &&
        a.y + a.height > b.y
      );
    }

    function checkCollisions() {
      for (let i = bullets.length - 1; i >= 0; i--) {
        for (let j = enemies.length - 1; j >= 0; j--) {
          if (collision(bullets[i], enemies[j])) {
            bullets.splice(i, 1);
            enemies.splice(j, 1);

            score += 100;
            break;
          }
        }
      }

      for (let i = enemyBullets.length - 1; i >= 0; i--) {
        if (collision(enemyBullets[i], player)) {
          enemyBullets.splice(i, 1);
          player.health--;

          if (player.health <= 0) {
            gameOver = true;
          }
        }
      }
    }

    function drawHUD() {
      ctx.fillStyle = "white";
      ctx.font = "22px Arial";

      ctx.fillText("Score: " + score, 20, 50);
      ctx.fillText("Health: " + player.health, 460, 50);
    }

    function drawGameOver() {
      ctx.fillStyle = "rgba(0,0,0,0.7)";
      ctx.fillRect(0, 0, canvas.width, canvas.height);

      ctx.fillStyle = "white";
      ctx.textAlign = "center";

      ctx.font = "48px Arial";
      ctx.fillText(
        "GAME OVER",
        canvas.width / 2,
        canvas.height / 2
      );

      ctx.font = "24px Arial";
      ctx.fillText(
        "Score: " + score,
        canvas.width / 2,
        canvas.height / 2 + 50
      );

      ctx.textAlign = "left";
    }

    function gameLoop() {
      ctx.clearRect(0, 0, canvas.width, canvas.height);

      drawStars();

      if (!gameOver) {
        updatePlayer();
        drawPlayer();
        drawBullets();
        drawEnemies();
        drawEnemyBullets();
        checkCollisions();
        drawHUD();
      } else {
        drawPlayer();
        drawHUD();
        drawGameOver();
      }

      requestAnimationFrame(gameLoop);
    }

    gameLoop();
  </script>

</body>
</html>
