<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Space Raiders</title>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      min-height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
      background: #050510;
      color: white;
      font-family: Arial, Helvetica, sans-serif;
      overflow: hidden;
    }

    #gameContainer {
      position: relative;
    }

    canvas {
      display: block;
      background: linear-gradient(#02030d, #080824);
      border: 2px solid #6262c9;
      box-shadow:
        0 0 12px #5555ff,
        0 0 35px rgba(90, 90, 255, 0.45);
    }

    #startScreen,
    #gameOverScreen {
      position: absolute;
      inset: 0;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      background: rgba(2, 3, 15, 0.76);
      text-align: center;
    }

    #gameOverScreen {
      display: none;
    }

    h1 {
      margin: 0 0 8px;
      font-size: 52px;
      letter-spacing: 5px;
      text-shadow:
        0 0 10px #47eaff,
        0 0 25px #5662ff;
    }

    .subtitle {
      color: #b8c5ff;
      margin-bottom: 30px;
    }

    button {
      padding: 13px 30px;
      border: 1px solid #62efff;
      border-radius: 8px;
      background: #101533;
      color: white;
      font-size: 18px;
      font-weight: bold;
      cursor: pointer;
      box-shadow: 0 0 14px rgba(77, 226, 255, 0.5);
    }

    button:hover {
      background: #18204d;
      transform: scale(1.04);
    }

    .controls {
      margin-top: 22px;
      font-size: 14px;
      color: #aeb6d6;
    }
  </style>
</head>

<body>

<div id="gameContainer">

  <canvas id="game" width="600" height="800"></canvas>

  <div id="startScreen">
    <h1>SPACE RAIDERS</h1>
    <div class="subtitle">Defend the galaxy.</div>

    <button id="startBtn">START MISSION</button>

    <div class="controls">
      WASD / Arrow Keys to move<br>
      Hold SPACE to fire
    </div>
  </div>

  <div id="gameOverScreen">
    <h1>GAME OVER</h1>
    <div class="subtitle" id="finalScore">Score: 0</div>

    <button id="restartBtn">PLAY AGAIN</button>
  </div>

</div>

<script>
const canvas = document.getElementById("game");
const ctx = canvas.getContext("2d");

const startScreen = document.getElementById("startScreen");
const gameOverScreen = document.getElementById("gameOverScreen");
const startBtn = document.getElementById("startBtn");
const restartBtn = document.getElementById("restartBtn");
const finalScore = document.getElementById("finalScore");

const keys = {};

let running = false;
let score = 0;
let frame = 0;

const player = {
  x: 280,
  y: 690,
  width: 44,
  height: 58,
  speed: 6,
  health: 100,
  cooldown: 0
};

const stars = [];
const bullets = [];
const enemies = [];
const enemyBullets = [];
const asteroids = [];
const particles = [];

for (let i = 0; i < 130; i++) {
  stars.push({
    x: Math.random() * canvas.width,
    y: Math.random() * canvas.height,
    size: Math.random() * 2 + 0.5,
    speed: Math.random() * 2 + 0.5,
    alpha: Math.random() * 0.7 + 0.3
  });
}

document.addEventListener("keydown", e => {
  keys[e.key.toLowerCase()] = true;

  if (e.code === "Space") {
    keys.space = true;
    e.preventDefault();
  }
});

document.addEventListener("keyup", e => {
  keys[e.key.toLowerCase()] = false;

  if (e.code === "Space") {
    keys.space = false;
  }
});

startBtn.addEventListener("click", startGame);
restartBtn.addEventListener("click", startGame);

function startGame() {
  score = 0;
  frame = 0;
  running = true;

  player.x = canvas.width / 2 - player.width / 2;
  player.y = 690;
  player.health = 100;
  player.cooldown = 0;

  bullets.length = 0;
  enemies.length = 0;
  enemyBullets.length = 0;
  asteroids.length = 0;
  particles.length = 0;

  startScreen.style.display = "none";
  gameOverScreen.style.display = "none";
}

function endGame() {
  running = false;
  finalScore.textContent = "Score: " + score;
  gameOverScreen.style.display = "flex";
}

function updateStars() {
  stars.forEach(star => {
    star.y += star.speed;

    if (star.y > canvas.height) {
      star.y = -5;
      star.x = Math.random() * canvas.width;
    }

    ctx.globalAlpha = star.alpha;
    ctx.fillStyle = "white";
    ctx.fillRect(star.x, star.y, star.size, star.size);
  });

  ctx.globalAlpha = 1;
}

function drawPlayer() {
  const x = player.x;
  const y = player.y;

  ctx.save();

  ctx.shadowColor = "#47eaff";
  ctx.shadowBlur = 12;

  // left wing
  ctx.fillStyle = "#1683b8";
  ctx.beginPath();
  ctx.moveTo(x + 20, y + 22);
  ctx.lineTo(x - 8, y + 53);
  ctx.lineTo(x + 15, y + 48);
  ctx.closePath();
  ctx.fill();

  // right wing
  ctx.beginPath();
  ctx.moveTo(x + 24, y + 22);
  ctx.lineTo(x + 52, y + 53);
  ctx.lineTo(x + 29, y + 48);
  ctx.closePath();
  ctx.fill();

  // main hull
  const gradient = ctx.createLinearGradient(x, y, x + 44, y + 58);
  gradient.addColorStop(0, "#d8fbff");
  gradient.addColorStop(0.45, "#38dfff");
  gradient.addColorStop(1, "#1660a8");

  ctx.fillStyle = gradient;

  ctx.beginPath();
  ctx.moveTo(x + 22, y);
  ctx.lineTo(x + 7, y + 48);
  ctx.lineTo(x + 22, y + 42);
  ctx.lineTo(x + 37, y + 48);
  ctx.closePath();
  ctx.fill();

  // cockpit
  ctx.shadowBlur = 6;
  ctx.fillStyle = "#163472";
  ctx.beginPath();
  ctx.ellipse(x + 22, y + 22, 6, 11, 0, 0, Math.PI * 2);
  ctx.fill();

  // engine glow
  ctx.shadowColor = "#ff7b32";
  ctx.shadowBlur = 15;
  ctx.fillStyle = "#ffd24a";

  ctx.beginPath();
  ctx.moveTo(x + 15, y + 46);
  ctx.lineTo(x + 19, y + 67 + Math.random() * 7);
  ctx.lineTo(x + 23, y + 46);
  ctx.fill();

  ctx.beginPath();
  ctx.moveTo(x + 23, y + 46);
  ctx.lineTo(x + 27, y + 67 + Math.random() * 7);
  ctx.lineTo(x + 31, y + 46);
  ctx.fill();

  ctx.restore();
}

function shootPlayer() {
  if (player.cooldown > 0) return;

  bullets.push({
    x: player.x + 8,
    y: player.y + 5,
    width: 4,
    height: 22,
    speed: 11
  });

  bullets.push({
    x: player.x + 32,
    y: player.y + 5,
    width: 4,
    height: 22,
    speed: 11
  });

  player.cooldown = 10;
}

function updatePlayer() {
  if (keys.a || keys.arrowleft) player.x -= player.speed;
  if (keys.d || keys.arrowright) player.x += player.speed;
  if (keys.w || keys.arrowup) player.y -= player.speed;
  if (keys.s || keys.arrowdown) player.y += player.speed;

  if (keys.space) shootPlayer();

  player.x = Math.max(8, Math.min(canvas.width - player.width - 8, player.x));
  player.y = Math.max(70, Math.min(canvas.height - player.height - 12, player.y));

  if (player.cooldown > 0) player.cooldown--;
}

function drawPlayerBullets() {
  for (let i = bullets.length - 1; i >= 0; i--) {
    const b = bullets[i];

    b.y -= b.speed;

    ctx.save();

    ctx.shadowColor = "#37ff9d";
    ctx.shadowBlur = 15;

    const laserGradient = ctx.createLinearGradient(
      b.x,
      b.y,
      b.x,
      b.y + b.height
    );

    laserGradient.addColorStop(0, "white");
    laserGradient.addColorStop(1, "#00ff88");

    ctx.fillStyle = laserGradient;
    ctx.fillRect(b.x, b.y, b.width, b.height);

    ctx.restore();

    if (b.y < -30) {
      bullets.splice(i, 1);
    }
  }
}

function spawnEnemy() {
  enemies.push({
    x: Math.random() * 520 + 20,
    y: -70,
    width: 52,
    height: 48,
    speed: 1.8 + Math.random(),
    cooldown: 60 + Math.random() * 100
  });
}

function drawEnemy(enemy) {
  const x = enemy.x;
  const y = enemy.y;

  ctx.save();

  ctx.shadowColor = "#ff3366";
  ctx.shadowBlur = 12;

  // wings
  ctx.fillStyle = "#8e173f";

  ctx.beginPath();
  ctx.moveTo(x + 26, y + 17);
  ctx.lineTo(x - 8, y);
  ctx.lineTo(x + 7, y + 38);
  ctx.closePath();
  ctx.fill();

  ctx.beginPath();
  ctx.moveTo(x + 26, y + 17);
  ctx.lineTo(x + 60, y);
  ctx.lineTo(x + 45, y + 38);
  ctx.closePath();
  ctx.fill();

  // body
  const gradient = ctx.createLinearGradient(x, y, x + 52, y + 48);
  gradient.addColorStop(0, "#ff88aa");
  gradient.addColorStop(0.5, "#ff2f67");
  gradient.addColorStop(1, "#7e1237");

  ctx.fillStyle = gradient;

  ctx.beginPath();
  ctx.moveTo(x + 26, y + 48);
  ctx.lineTo(x + 10, y + 6);
  ctx.lineTo(x + 26, y + 14);
  ctx.lineTo(x + 42, y + 6);
  ctx.closePath();
  ctx.fill();

  // cockpit
  ctx.fillStyle = "#ffd5df";
  ctx.beginPath();
  ctx.arc(x + 26, y + 27, 5, 0, Math.PI * 2);
  ctx.fill();

  ctx.restore();
}

function updateEnemies() {
  for (let i = enemies.length - 1; i >= 0; i--) {
    const enemy = enemies[i];

    enemy.y += enemy.speed;
    enemy.cooldown--;

    drawEnemy(enemy);

    if (enemy.cooldown <= 0 && enemy.y > 20) {
      enemyBullets.push({
        x: enemy.x + 26,
        y: enemy.y + 42,
        radius: 6,
        speed: 4
      });

      enemy.cooldown = 110 + Math.random() * 90;
    }

    if (enemy.y > canvas.height + 70) {
      enemies.splice(i, 1);
    }
  }
}

function drawEnemyBullets() {
  for (let i = enemyBullets.length - 1; i >= 0; i--) {
    const b = enemyBullets[i];

    b.y += b.speed;

    ctx.save();

    ctx.shadowColor = "#ff2a47";
    ctx.shadowBlur = 16;
    ctx.fillStyle = "#ff405c";

    ctx.beginPath();
    ctx.arc(b.x, b.y, b.radius, 0, Math.PI * 2);
    ctx.fill();

    ctx.restore();

    if (b.y > canvas.height + 20) {
      enemyBullets.splice(i, 1);
    }
  }
}

function spawnAsteroid() {
  const size = 35 + Math.random() * 30;

  asteroids.push({
    x: Math.random() * (canvas.width - size),
    y: -size,
    width: size,
    height: size,
    speed: 1.4 + Math.random() * 1.5,
    rotation: Math.random() * Math.PI,
    rotationSpeed: (Math.random() - 0.5) * 0.035
  });
}

function drawAsteroids() {
  for (let i = asteroids.length - 1; i >= 0; i--) {
    const a = asteroids[i];

    a.y += a.speed;
    a.rotation += a.rotationSpeed;

    ctx.save();

    ctx.translate(
      a.x + a.width / 2,
      a.y + a.height / 2
    );

    ctx.rotate(a.rotation);

    const radius = a.width / 2;

    const grad = ctx.createRadialGradient(
      -8, -8, 3,
      0, 0, radius
    );

    grad.addColorStop(0, "#aaaab8");
    grad.addColorStop(1, "#454552");

    ctx.fillStyle = grad;

    ctx.beginPath();

    for (let p = 0; p < 10; p++) {
      const angle = p / 10 * Math.PI * 2;
      const variation = p % 2 === 0 ? 1 : 0.78;

      const px = Math.cos(angle) * radius * variation;
      const py = Math.sin(angle) * radius * variation;

      if (p === 0) ctx.moveTo(px, py);
      else ctx.lineTo(px, py);
    }

    ctx.closePath();
    ctx.fill();

    ctx.fillStyle = "#34343e";

    ctx.beginPath();
    ctx.arc(-8, -6, radius * 0.17, 0, Math.PI * 2);
    ctx.fill();

    ctx.beginPath();
    ctx.arc(8, 8, radius * 0.12, 0, Math.PI * 2);
    ctx.fill();

    ctx.restore();

    if (a.y > canvas.height + 80) {
      asteroids.splice(i, 1);
    }
  }
}

function createExplosion(x, y) {
  for (let i = 0; i < 28; i++) {
    particles.push({
      x,
      y,
      dx: (Math.random() - 0.5) * 8,
      dy: (Math.random() - 0.5) * 8,
      life: 35 + Math.random() * 15,
      radius: Math.random() * 5 + 2
    });
  }
}

function updateParticles() {
  for (let i = particles.length - 1; i >= 0; i--) {
    const p = particles[i];

    p.x += p.dx;
    p.y += p.dy;
    p.dx *= 0.97;
    p.dy *= 0.97;
    p.life--;

    ctx.globalAlpha = Math.max(0, p.life / 45);

    if (p.life > 30) ctx.fillStyle = "#fff6b0";
    else if (p.life > 15) ctx.fillStyle = "#ff9a26";
    else ctx.fillStyle = "#ff334f";

    ctx.beginPath();
    ctx.arc(p.x, p.y, p.radius, 0, Math.PI * 2);
    ctx.fill();

    ctx.globalAlpha = 1;

    if (p.life <= 0) {
      particles.splice(i, 1);
    }
  }
}

function rectCollision(a, b) {
  return (
    a.x < b.x + b.width &&
    a.x + a.width > b.x &&
    a.y < b.y + b.height &&
    a.y + a.height > b.y
  );
}

function bulletHitsPlayer(b) {
  return (
    b.x + b.radius > player.x &&
    b.x - b.radius < player.x + player.width &&
    b.y + b.radius > player.y &&
    b.y - b.radius < player.y + player.height
  );
}

function damagePlayer(amount) {
  player.health -= amount;

  createExplosion(
    player.x + player.width / 2,
    player.y + player.height / 2
  );

  if (player.health <= 0) {
    player.health = 0;
    endGame();
  }
}

function checkCollisions() {

  // player bullets vs enemies
  for (let i = bullets.length - 1; i >= 0; i--) {
    let bulletRemoved = false;

    for (let j = enemies.length - 1; j >= 0; j--) {
      if (rectCollision(bullets[i], enemies[j])) {

        createExplosion(
          enemies[j].x + enemies[j].width / 2,
          enemies[j].y + enemies[j].height / 2
        );

        bullets.splice(i, 1);
        enemies.splice(j, 1);

        score += 100;
        bulletRemoved = true;

        break;
      }
    }

    if (bulletRemoved) continue;
  }

  // player bullets vs asteroids
  for (let i = bullets.length - 1; i >= 0; i--) {

    for (let j = asteroids.length - 1; j >= 0; j--) {

      if (rectCollision(bullets[i], asteroids[j])) {

        createExplosion(
          asteroids[j].x + asteroids[j].width / 2,
          asteroids[j].y + asteroids[j].height / 2
        );

        bullets.splice(i, 1);
        asteroids.splice(j, 1);

        score += 50;

        break;
      }
    }
  }

  // enemy bullets vs player
  for (let i = enemyBullets.length - 1; i >= 0; i--) {

    if (bulletHitsPlayer(enemyBullets[i])) {

      enemyBullets.splice(i, 1);
      damagePlayer(20);
    }
  }

  // asteroids vs player
  for (let i = asteroids.length - 1; i >= 0; i--) {

    if (rectCollision(asteroids[i], player)) {

      asteroids.splice(i, 1);
      damagePlayer(30);
    }
  }

  // enemy ships vs player
  for (let i = enemies.length - 1; i >= 0; i--) {

    if (rectCollision(enemies[i], player)) {

      createExplosion(
        enemies[i].x + enemies[i].width / 2,
        enemies[i].y + enemies[i].height / 2
      );

      enemies.splice(i, 1);
      damagePlayer(30);
    }
  }
}

function drawHUD() {
  ctx.save();

  ctx.fillStyle = "white";
  ctx.font = "bold 20px Arial";
  ctx.fillText("SCORE  " + score, 20, 38);

  ctx.font = "bold 15px Arial";
  ctx.fillText("SHIELD", 405, 32);

  ctx.fillStyle = "#20243b";
  ctx.fillRect(470, 19, 105, 18);

  const healthWidth = 101 * (player.health / 100);

  const healthGradient = ctx.createLinearGradient(
    470, 0, 575, 0
  );

  healthGradient.addColorStop(0, "#28ffb2");
  healthGradient.addColorStop(1, "#48b8ff");

  ctx.fillStyle = healthGradient;
  ctx.fillRect(472, 21, healthWidth, 14);

  ctx.strokeStyle = "#bdeeff";
  ctx.strokeRect(470, 19, 105, 18);

  ctx.restore();
}

function spawnObjects() {
  if (frame % 75 === 0) {
    spawnEnemy();
  }

  if (frame % 145 === 0) {
    spawnAsteroid();
  }
}

function gameLoop() {
  ctx.clearRect(0, 0, canvas.width, canvas.height);

  updateStars();

  if (running) {

    frame++;

    updatePlayer();
    spawnObjects();

    drawPlayerBullets();
    updateEnemies();
    drawEnemyBullets();
    drawAsteroids();

    checkCollisions();

    drawPlayer();
    updateParticles();
    drawHUD();

  } else {

    drawAsteroids();
    updateParticles();

    if (player.health > 0) {
      drawPlayer();
    }
  }

  requestAnimationFrame(gameLoop);
}

gameLoop();
</script>

</body>
</html>
