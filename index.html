<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Space Raiders</title>

  <style>
    * { box-sizing: border-box; }

    body {
      margin: 0;
      min-height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
      background: #050510;
      color: white;
      font-family: Arial, Helvetica, sans-serif;
      overflow: hidden;
    }

    #gameContainer { position: relative; }

    canvas {
      display: block;
      background: linear-gradient(#02030d, #080824);
      border: 2px solid #6262c9;
      box-shadow:
        0 0 12px #5555ff,
        0 0 35px rgba(90, 90, 255, 0.45);
    }

    #startScreen,
    #gameOverScreen {
      position: absolute;
      inset: 0;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      background: rgba(2, 3, 15, 0.76);
      text-align: center;
    }

    #gameOverScreen { display: none; }

    h1 {
      margin: 0 0 8px;
      font-size: 52px;
      letter-spacing: 5px;
      text-shadow:
        0 0 10px #47eaff,
        0 0 25px #5662ff;
    }

    .subtitle {
      color: #b8c5ff;
      margin-bottom: 30px;
    }

    button {
      padding: 13px 30px;
      border: 1px solid #62efff;
      border-radius: 8px;
      background: #101533;
      color: white;
      font-size: 18px;
      font-weight: bold;
      cursor: pointer;
      box-shadow: 0 0 14px rgba(77, 226, 255, 0.5);
    }

    button:hover {
      background: #18204d;
      transform: scale(1.04);
    }

    .controls {
      margin-top: 22px;
      font-size: 14px;
      color: #aeb6d6;
    }
  </style>
</head>

<body>

<div id="gameContainer">

  <canvas id="game" width="600" height="800"></canvas>

  <div id="startScreen">
    <h1>SPACE RAIDERS</h1>
    <div class="subtitle">Defend the galaxy.</div>
    <button id="startBtn">START MISSION</button>

    <div class="controls">
      WASD / Arrow Keys to move<br>
      Hold SPACE to fire
    </div>
  </div>

  <div id="gameOverScreen">
    <h1>GAME OVER</h1>
    <div class="subtitle" id="finalScore">Score: 0</div>
    <button id="restartBtn">PLAY AGAIN</button>
  </div>

</div>

<script>
const canvas = document.getElementById("game");
const ctx = canvas.getContext("2d");

const startScreen = document.getElementById("startScreen");
const gameOverScreen = document.getElementById("gameOverScreen");
const startBtn = document.getElementById("startBtn");
const restartBtn = document.getElementById("restartBtn");
const finalScore = document.getElementById("finalScore");

const keys = {};

let running = false;
let score = 0;
let frame = 0;

let wave = 1;
let waveKills = 0;
let waveTarget = 8;
let waveDelay = 0;
let showingWaveText = 0;

let bossActive = false;
let boss = null;

const player = {
  x: 280,
  y: 690,
  width: 44,
  height: 58,
  speed: 6,
  health: 100,
  cooldown: 0,
  invincible: 0
};

const stars = [];
const bullets = [];
const enemies = [];
const enemyBullets = [];
const asteroids = [];
const particles = [];

for (let i = 0; i < 130; i++) {
  stars.push({
    x: Math.random() * canvas.width,
    y: Math.random() * canvas.height,
    size: Math.random() * 2 + 0.5,
    speed: Math.random() * 2 + 0.5,
    alpha: Math.random() * 0.7 + 0.3
  });
}

document.addEventListener("keydown", e => {
  keys[e.key.toLowerCase()] = true;

  if (e.code === "Space") {
    keys.space = true;
    e.preventDefault();
  }
});

document.addEventListener("keyup", e => {
  keys[e.key.toLowerCase()] = false;

  if (e.code === "Space") {
    keys.space = false;
  }
});

startBtn.addEventListener("click", startGame);
restartBtn.addEventListener("click", startGame);

function startGame() {
  running = true;
  score = 0;
  frame = 0;

  wave = 1;
  waveKills = 0;
  waveTarget = 8;
  waveDelay = 0;
  showingWaveText = 120;

  bossActive = false;
  boss = null;

  player.x = canvas.width / 2 - player.width / 2;
  player.y = 690;
  player.health = 100;
  player.cooldown = 0;
  player.invincible = 0;

  bullets.length = 0;
  enemies.length = 0;
  enemyBullets.length = 0;
  asteroids.length = 0;
  particles.length = 0;

  startScreen.style.display = "none";
  gameOverScreen.style.display = "none";
}

function endGame() {
  running = false;
  finalScore.textContent = "Score: " + score;
  gameOverScreen.style.display = "flex";
}

function updateStars() {
  stars.forEach(star => {
    star.y += star.speed;

    if (star.y > canvas.height) {
      star.y = -5;
      star.x = Math.random() * canvas.width;
    }

    ctx.globalAlpha = star.alpha;
    ctx.fillStyle = "white";
    ctx.fillRect(star.x, star.y, star.size, star.size);
  });

  ctx.globalAlpha = 1;
}

function drawPlayer() {
  const x = player.x;
  const y = player.y;

  ctx.save();

  if (player.invincible > 0 && Math.floor(player.invincible / 5) % 2 === 0) {
    ctx.globalAlpha = 0.35;
  }

  ctx.shadowColor = "#47eaff";
  ctx.shadowBlur = 12;

  ctx.fillStyle = "#1683b8";

  ctx.beginPath();
  ctx.moveTo(x + 20, y + 22);
  ctx.lineTo(x - 8, y + 53);
  ctx.lineTo(x + 15, y + 48);
  ctx.closePath();
  ctx.fill();

  ctx.beginPath();
  ctx.moveTo(x + 24, y + 22);
  ctx.lineTo(x + 52, y + 53);
  ctx.lineTo(x + 29, y + 48);
  ctx.closePath();
  ctx.fill();

  const gradient = ctx.createLinearGradient(x, y, x + 44, y + 58);
  gradient.addColorStop(0, "#d8fbff");
  gradient.addColorStop(0.45, "#38dfff");
  gradient.addColorStop(1, "#1660a8");

  ctx.fillStyle = gradient;

  ctx.beginPath();
  ctx.moveTo(x + 22, y);
  ctx.lineTo(x + 7, y + 48);
  ctx.lineTo(x + 22, y + 42);
  ctx.lineTo(x + 37, y + 48);
  ctx.closePath();
  ctx.fill();

  ctx.fillStyle = "#163472";
  ctx.beginPath();
  ctx.ellipse(x + 22, y + 22, 6, 11, 0, 0, Math.PI * 2);
  ctx.fill();

  ctx.shadowColor = "#ff7b32";
  ctx.shadowBlur = 15;
  ctx.fillStyle = "#ffd24a";

  ctx.beginPath();
  ctx.moveTo(x + 15, y + 46);
  ctx.lineTo(x + 19, y + 67 + Math.random() * 7);
  ctx.lineTo(x + 23, y + 46);
  ctx.fill();

  ctx.beginPath();
  ctx.moveTo(x + 23, y + 46);
  ctx.lineTo(x + 27, y + 67 + Math.random() * 7);
  ctx.lineTo(x + 31, y + 46);
  ctx.fill();

  ctx.restore();
}

function shootPlayer() {
  if (player.cooldown > 0) return;

  bullets.push({
    x: player.x + 8,
    y: player.y + 5,
    width: 4,
    height: 22,
    speed: 11,
    damage: 1
  });

  bullets.push({
    x: player.x + 32,
    y: player.y + 5,
    width: 4,
    height: 22,
    speed: 11,
    damage: 1
  });

  player.cooldown = 10;
}

function updatePlayer() {
  if (keys.a || keys.arrowleft) player.x -= player.speed;
  if (keys.d || keys.arrowright) player.x += player.speed;
  if (keys.w || keys.arrowup) player.y -= player.speed;
  if (keys.s || keys.arrowdown) player.y += player.speed;

  if (keys.space) shootPlayer();

  player.x = Math.max(8, Math.min(canvas.width - player.width - 8, player.x));
  player.y = Math.max(70, Math.min(canvas.height - player.height - 12, player.y));

  if (player.cooldown > 0) player.cooldown--;
  if (player.invincible > 0) player.invincible--;
}

function drawPlayerBullets() {
  for (let i = bullets.length - 1; i >= 0; i--) {
    const b = bullets[i];
    b.y -= b.speed;

    ctx.save();
    ctx.shadowColor = "#37ff9d";
    ctx.shadowBlur = 15;

    const laserGradient = ctx.createLinearGradient(b.x, b.y, b.x, b.y + b.height);
    laserGradient.addColorStop(0, "white");
    laserGradient.addColorStop(1, "#00ff88");

    ctx.fillStyle = laserGradient;
    ctx.fillRect(b.x, b.y, b.width, b.height);
    ctx.restore();

    if (b.y < -30) bullets.splice(i, 1);
  }
}

function spawnEnemy() {
  const speedBoost = (wave - 1) * 0.3;

  enemies.push({
    x: Math.random() * 520 + 20,
    y: -70,
    width: 52,
    height: 48,
    speed: 1.8 + Math.random() + speedBoost,
    cooldown: 60 + Math.random() * 90,
    hp: wave >= 3 ? 2 : 1
  });
}

function drawEnemy(enemy) {
  const x = enemy.x;
  const y = enemy.y;

  ctx.save();
  ctx.shadowColor = "#ff3366";
  ctx.shadowBlur = 12;

  ctx.fillStyle = "#8e173f";

  ctx.beginPath();
  ctx.moveTo(x + 26, y + 17);
  ctx.lineTo(x - 8, y);
  ctx.lineTo(x + 7, y + 38);
  ctx.closePath();
  ctx.fill();

  ctx.beginPath();
  ctx.moveTo(x + 26, y + 17);
  ctx.lineTo(x + 60, y);
  ctx.lineTo(x + 45, y + 38);
  ctx.closePath();
  ctx.fill();

  const gradient = ctx.createLinearGradient(x, y, x + 52, y + 48);
  gradient.addColorStop(0, "#ff88aa");
  gradient.addColorStop(0.5, "#ff2f67");
  gradient.addColorStop(1, "#7e1237");

  ctx.fillStyle = gradient;

  ctx.beginPath();
  ctx.moveTo(x + 26, y + 48);
  ctx.lineTo(x + 10, y + 6);
  ctx.lineTo(x + 26, y + 14);
  ctx.lineTo(x + 42, y + 6);
  ctx.closePath();
  ctx.fill();

  ctx.fillStyle = "#ffd5df";
  ctx.beginPath();
  ctx.arc(x + 26, y + 27, 5, 0, Math.PI * 2);
  ctx.fill();

  ctx.restore();
}

function updateEnemies() {
  for (let i = enemies.length - 1; i >= 0; i--) {
    const enemy = enemies[i];

    enemy.y += enemy.speed;
    enemy.cooldown--;

    drawEnemy(enemy);

    if (enemy.cooldown <= 0 && enemy.y > 20) {
      enemyBullets.push({
        x: enemy.x + 26,
        y: enemy.y + 42,
        dx: 0,
        dy: 3.8 + wave * 0.25,
        radius: 6
      });

      enemy.cooldown = 100 + Math.random() * 75;
    }

    if (enemy.y > canvas.height + 70) {
      enemies.splice(i, 1);
    }
  }
}

function spawnBoss() {
  bossActive = true;

  enemies.length = 0;
  enemyBullets.length = 0;

  boss = {
    x: canvas.width / 2 - 90,
    y: -150,
    width: 180,
    height: 110,
    hp: 80,
    maxHp: 80,
    direction: 1,
    entering: true,
    shootTimer: 0,
    attackMode: 0
  };
}

function drawBoss() {
  if (!boss) return;

  const x = boss.x;
  const y = boss.y;

  ctx.save();

  ctx.shadowColor = "#ff2f77";
  ctx.shadowBlur = 25;

  const g = ctx.createLinearGradient(x, y, x + boss.width, y + boss.height);
  g.addColorStop(0, "#ff7db7");
  g.addColorStop(0.45, "#b62679");
  g.addColorStop(1, "#471052");

  ctx.fillStyle = g;

  ctx.beginPath();
  ctx.moveTo(x + 90, y + 100);
  ctx.lineTo(x + 10, y + 25);
  ctx.lineTo(x + 55, y + 35);
  ctx.lineTo(x + 90, y);
  ctx.lineTo(x + 125, y + 35);
  ctx.lineTo(x + 170, y + 25);
  ctx.closePath();
  ctx.fill();

  ctx.fillStyle = "#ffd5ef";
  ctx.beginPath();
  ctx.arc(x + 90, y + 46, 17, 0, Math.PI * 2);
  ctx.fill();

  ctx.fillStyle = "#7b165b";
  ctx.beginPath();
  ctx.arc(x + 90, y + 46, 9, 0, Math.PI * 2);
  ctx.fill();

  ctx.restore();
}

function bossFireSpread() {
  for (let angle = -0.8; angle <= 0.8; angle += 0.4) {
    enemyBullets.push({
      x: boss.x + boss.width / 2,
      y: boss.y + boss.height - 10,
      dx: Math.sin(angle) * 3,
      dy: Math.cos(angle) * 4.2,
      radius: 7
    });
  }
}

function bossFireAim() {
  const sx = boss.x + boss.width / 2;
  const sy = boss.y + boss.height;

  const px = player.x + player.width / 2;
  const py = player.y + player.height / 2;

  const angle = Math.atan2(py - sy, px - sx);

  for (let offset = -0.18; offset <= 0.18; offset += 0.18) {
    enemyBullets.push({
      x: sx,
      y: sy,
      dx: Math.cos(angle + offset) * 4.2,
      dy: Math.sin(angle + offset) * 4.2,
      radius: 7
    });
  }
}

function updateBoss() {
  if (!boss) return;

  if (boss.entering) {
    boss.y += 2;

    if (boss.y >= 75) {
      boss.y = 75;
      boss.entering = false;
    }
  } else {
    boss.x += boss.direction * 2.2;

    if (boss.x <= 20 || boss.x + boss.width >= canvas.width - 20) {
      boss.direction *= -1;
    }

    boss.shootTimer++;

    if (boss.shootTimer > 65) {
      if (boss.attackMode % 2 === 0) bossFireSpread();
      else bossFireAim();

      boss.attackMode++;
      boss.shootTimer = 0;
    }
  }

  drawBoss();
}

function drawEnemyBullets() {
  for (let i = enemyBullets.length - 1; i >= 0; i--) {
    const b = enemyBullets[i];

    b.x += b.dx || 0;
    b.y += b.dy;

    ctx.save();
    ctx.shadowColor = "#ff2a47";
    ctx.shadowBlur = 16;
    ctx.fillStyle = "#ff405c";

    ctx.beginPath();
    ctx.arc(b.x, b.y, b.radius, 0, Math.PI * 2);
    ctx.fill();

    ctx.restore();

    if (
      b.y > canvas.height + 30 ||
      b.y < -30 ||
      b.x < -30 ||
      b.x > canvas.width + 30
    ) {
      enemyBullets.splice(i, 1);
    }
  }
}

function spawnAsteroid() {
  const size = 35 + Math.random() * 30;

  asteroids.push({
    x: Math.random() * (canvas.width - size),
    y: -size,
    width: size,
    height: size,
    speed: 1.4 + Math.random() * 1.5,
    rotation: Math.random() * Math.PI,
    rotationSpeed: (Math.random() - 0.5) * 0.035
  });
}

function drawAsteroids() {
  for (let i = asteroids.length - 1; i >= 0; i--) {
    const a = asteroids[i];

    a.y += a.speed;
    a.rotation += a.rotationSpeed;

    ctx.save();
    ctx.translate(a.x + a.width / 2, a.y + a.height / 2);
    ctx.rotate(a.rotation);

    const radius = a.width / 2;

    const grad = ctx.createRadialGradient(-8, -8, 3, 0, 0, radius);
    grad.addColorStop(0, "#aaaab8");
    grad.addColorStop(1, "#454552");

    ctx.fillStyle = grad;
    ctx.beginPath();

    for (let p = 0; p < 10; p++) {
      const angle = p / 10 * Math.PI * 2;
      const variation = p % 2 === 0 ? 1 : 0.78;

      const px = Math.cos(angle) * radius * variation;
      const py = Math.sin(angle) * radius * variation;

      if (p === 0) ctx.moveTo(px, py);
      else ctx.lineTo(px, py);
    }

    ctx.closePath();
    ctx.fill();

    ctx.fillStyle = "#34343e";

    ctx.beginPath();
    ctx.arc(-8, -6, radius * 0.17, 0, Math.PI * 2);
    ctx.fill();

    ctx.beginPath();
    ctx.arc(8, 8, radius * 0.12, 0, Math.PI * 2);
    ctx.fill();

    ctx.restore();

    if (a.y > canvas.height + 80) {
      asteroids.splice(i, 1);
    }
  }
}

function createExplosion(x, y) {
  for (let i = 0; i < 28; i++) {
    particles.push({
      x,
      y,
      dx: (Math.random() - 0.5) * 8,
      dy: (Math.random() - 0.5) * 8,
      life: 35 + Math.random() * 15,
      radius: Math.random() * 5 + 2
    });
  }
}

function updateParticles() {
  for (let i = particles.length - 1; i >= 0; i--) {
    const p = particles[i];

    p.x += p.dx;
    p.y += p.dy;
    p.dx *= 0.97;
    p.dy *= 0.97;
    p.life--;

    ctx.globalAlpha = Math.max(0, p.life / 45);

    if (p.life > 30) ctx.fillStyle = "#fff6b0";
    else if (p.life > 15) ctx.fillStyle = "#ff9a26";
    else ctx.fillStyle = "#ff334f";

    ctx.beginPath();
    ctx.arc(p.x, p.y, p.radius, 0, Math.PI * 2);
    ctx.fill();

    ctx.globalAlpha = 1;

    if (p.life <= 0) particles.splice(i, 1);
  }
}

function rectCollision(a, b) {
  return (
    a.x < b.x + b.width &&
    a.x + a.width > b.x &&
    a.y < b.y + b.height &&
    a.y + a.height > b.y
  );
}

function bulletHitsPlayer(b) {
  return (
    b.x + b.radius > player.x &&
    b.x - b.radius < player.x + player.width &&
    b.y + b.radius > player.y &&
    b.y - b.radius < player.y + player.height
  );
}

function damagePlayer(amount) {
  if (player.invincible > 0) return;

  player.health -= amount;
  player.invincible = 45;

  createExplosion(
    player.x + player.width / 2,
    player.y + player.height / 2
  );

  if (player.health <= 0) {
    player.health = 0;
    endGame();
  }
}

function enemyDestroyed(enemyIndex) {
  createExplosion(
    enemies[enemyIndex].x + enemies[enemyIndex].width / 2,
    enemies[enemyIndex].y + enemies[enemyIndex].height / 2
  );

  enemies.splice(enemyIndex, 1);

  score += 100;
  waveKills++;

  if (!bossActive && waveKills >= waveTarget) {
    waveDelay = 100;
  }
}

function nextWave() {
  wave++;
  waveKills = 0;

  if (wave === 4) {
    showingWaveText = 120;
    spawnBoss();
    return;
  }

  waveTarget = 7 + wave * 3;
  showingWaveText = 120;

  enemyBullets.length = 0;
  asteroids.length = 0;
}

function bossDefeated() {
  createExplosion(
    boss.x + boss.width / 2,
    boss.y + boss.height / 2
  );

  score += 3000;

  boss = null;
  bossActive = false;

  wave = 5;
  waveKills = 0;
  waveTarget = 20;

  showingWaveText = 180;
  enemyBullets.length = 0;
}

function checkCollisions() {

  for (let i = bullets.length - 1; i >= 0; i--) {

    let used = false;

    if (bossActive && boss && rectCollision(bullets[i], boss)) {
      boss.hp -= bullets[i].damage;
      bullets.splice(i, 1);
      used = true;

      if (boss.hp <= 0) {
        bossDefeated();
      }
    }

    if (used) continue;

    for (let j = enemies.length - 1; j >= 0; j--) {
      if (rectCollision(bullets[i], enemies[j])) {

        enemies[j].hp--;

        bullets.splice(i, 1);

        if (enemies[j].hp <= 0) {
          enemyDestroyed(j);
        }

        used = true;
        break;
      }
    }

    if (used) continue;

    for (let j = asteroids.length - 1; j >= 0; j--) {
      if (rectCollision(bullets[i], asteroids[j])) {

        createExplosion(
          asteroids[j].x + asteroids[j].width / 2,
          asteroids[j].y + asteroids[j].height / 2
        );

        bullets.splice(i, 1);
        asteroids.splice(j, 1);

        score += 50;
        break;
      }
    }
  }

  for (let i = enemyBullets.length - 1; i >= 0; i--) {
    if (bulletHitsPlayer(enemyBullets[i])) {
      enemyBullets.splice(i, 1);
      damagePlayer(bossActive ? 15 : 20);
    }
  }

  for (let i = asteroids.length - 1; i >= 0; i--) {
    if (rectCollision(asteroids[i], player)) {
      asteroids.splice(i, 1);
      damagePlayer(30);
    }
  }

  for (let i = enemies.length - 1; i >= 0; i--) {
    if (rectCollision(enemies[i], player)) {
      createExplosion(
        enemies[i].x + enemies[i].width / 2,
        enemies[i].y + enemies[i].height / 2
      );

      enemies.splice(i, 1);
      damagePlayer(30);
    }
  }

  if (bossActive && boss && rectCollision(boss, player)) {
    damagePlayer(50);
  }
}

function drawHUD() {
  ctx.save();

  ctx.fillStyle = "white";
  ctx.font = "bold 18px Arial";

  ctx.fillText("SCORE  " + score, 20, 34);
  ctx.fillText("WAVE  " + (bossActive ? "BOSS" : wave), 20, 60);

  ctx.font = "bold 15px Arial";
  ctx.fillText("SHIELD", 405, 32);

  ctx.fillStyle = "#20243b";
  ctx.fillRect(470, 19, 105, 18);

  const healthWidth = 101 * (player.health / 100);

  const healthGradient = ctx.createLinearGradient(470, 0, 575, 0);
  healthGradient.addColorStop(0, "#28ffb2");
  healthGradient.addColorStop(1, "#48b8ff");

  ctx.fillStyle = healthGradient;
  ctx.fillRect(472, 21, healthWidth, 14);

  ctx.strokeStyle = "#bdeeff";
  ctx.strokeRect(470, 19, 105, 18);

  if (bossActive && boss) {
    ctx.fillStyle = "#27101f";
    ctx.fillRect(100, 75, 400, 20);

    const bossWidth = 396 * (boss.hp / boss.maxHp);

    const bossGradient = ctx.createLinearGradient(100, 0, 500, 0);
    bossGradient.addColorStop(0, "#ff225f");
    bossGradient.addColorStop(1, "#bd4cff");

    ctx.fillStyle = bossGradient;
    ctx.fillRect(102, 77, bossWidth, 16);

    ctx.strokeStyle = "#ffafd0";
    ctx.strokeRect(100, 75, 400, 20);

    ctx.fillStyle = "white";
    ctx.textAlign = "center";
    ctx.font = "bold 14px Arial";
    ctx.fillText("VOID DESTROYER", 300, 69);

    ctx.textAlign = "left";
  }

  ctx.restore();
}

function drawWaveMessage() {
  if (showingWaveText <= 0) return;

  ctx.save();

  ctx.globalAlpha = Math.min(1, showingWaveText / 40);

  ctx.fillStyle = "white";
  ctx.textAlign = "center";
  ctx.shadowColor = bossActive ? "#ff317d" : "#47eaff";
  ctx.shadowBlur = 20;

  ctx.font = "bold 40px Arial";

  if (bossActive) {
    ctx.fillText("WARNING", canvas.width / 2, 330);

    ctx.font = "bold 24px Arial";
    ctx.fillText("BOSS INCOMING", canvas.width / 2, 370);
  } else if (wave === 5) {
    ctx.fillText("BOSS DESTROYED", canvas.width / 2, 330);

    ctx.font = "bold 22px Arial";
    ctx.fillText("SURVIVAL MODE", canvas.width / 2, 370);
  } else {
    ctx.fillText("WAVE " + wave, canvas.width / 2, 350);
  }

  ctx.restore();

  showingWaveText--;
}

function spawnObjects() {

  if (bossActive) return;
  if (waveDelay > 0) return;

  const enemyRate = Math.max(45, 85 - wave * 8);
  const asteroidRate = Math.max(90, 155 - wave * 10);

  if (frame % enemyRate === 0) spawnEnemy();
  if (frame % asteroidRate === 0) spawnAsteroid();
}

function updateWaveSystem() {
  if (bossActive) return;

  if (waveDelay > 0) {
    waveDelay--;

    if (waveDelay === 1) {
      enemies.length = 0;
      enemyBullets.length = 0;
      asteroids.length = 0;

      nextWave();
    }
  }
}

function gameLoop() {
  ctx.clearRect(0, 0, canvas.width, canvas.height);

  updateStars();

  if (running) {

    frame++;

    updatePlayer();
    updateWaveSystem();
    spawnObjects();

    drawPlayerBullets();

    if (bossActive) {
      updateBoss();
    } else {
      updateEnemies();
      drawAsteroids();
    }

    drawEnemyBullets();

    checkCollisions();

    drawPlayer();
    updateParticles();
    drawHUD();
    drawWaveMessage();

  } else {

    drawAsteroids();
    updateParticles();

    if (player.health > 0) {
      drawPlayer();
    }
  }

  requestAnimationFrame(gameLoop);
}

gameLoop();
</script>

</html>
