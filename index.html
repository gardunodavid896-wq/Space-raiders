<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <title>Space Raiders</title>
  <style>
    * { box-sizing: border-box; }
    body {
      margin: 0;
      min-height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
      background: #050510;
      color: white;
      font-family: Arial, Helvetica, sans-serif;
      overflow: hidden;
    }
    #gameContainer {
      position: relative;
      width: min(100vw, 600px);
      height: min(100vh, 800px);
      aspect-ratio: 3 / 4;
      overflow: hidden;
      border-radius: 18px;
      background:
        radial-gradient(circle at 50% 20%, rgba(57, 90, 255, 0.14), transparent 38%),
        linear-gradient(#02030d, #080824 70%, #03030a);
      box-shadow: 0 0 28px rgba(85, 85, 255, 0.42), 0 20px 60px rgba(0,0,0,0.55);
    }
    canvas {
      display: block;
      width: 100%;
      height: 100%;
      background: transparent;
      border: 1px solid rgba(135, 149, 255, 0.5);
      border-radius: 18px;
      touch-action: none;
    }
    #startScreen, #gameOverScreen {
      position: absolute;
      inset: 0;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      background: rgba(2, 3, 15, 0.78);
      text-align: center;
      padding: 25px;
    }
    #gameOverScreen { display: none; }
    h1 {
      margin: 0 0 8px;
      font-size: 52px;
      letter-spacing: 5px;
      text-shadow: 0 0 10px #47eaff, 0 0 25px #5662ff;
    }
    .subtitle {
      color: #b8c5ff;
      margin-bottom: 22px;
      line-height: 1.5;
    }
    .best {
      margin-bottom: 22px;
      font-size: 17px;
      color: #ffe96b;
      text-shadow: 0 0 10px rgba(255, 233, 107, 0.45);
    }
    button {
      padding: 13px 30px;
      border: 1px solid #62efff;
      border-radius: 8px;
      background: #101533;
      color: white;
      font-size: 18px;
      font-weight: bold;
      cursor: pointer;
      box-shadow: 0 0 14px rgba(77, 226, 255, 0.5);
    }
    button:hover {
      background: #18204d;
      transform: scale(1.04);
    }
    .controls {
      margin-top: 22px;
      font-size: 14px;
      line-height: 1.55;
      color: #aeb6d6;
    }

    .mobileControls {
      display: none;
      position: absolute;
      inset: 0;
      pointer-events: none;
      z-index: 5;
    }

    .joystick {
      position: absolute;
      left: 18px;
      bottom: calc(22px + env(safe-area-inset-bottom));
      width: 138px;
      height: 138px;
      border-radius: 50%;
      border: 1px solid rgba(123, 225, 255, 0.5);
      background: radial-gradient(circle, rgba(30, 44, 92, 0.72), rgba(8, 12, 34, 0.58));
      box-shadow: inset 0 0 22px rgba(71, 234, 255, 0.18), 0 0 20px rgba(71, 234, 255, 0.12);
      pointer-events: auto;
      touch-action: none;
    }

    .stick {
      position: absolute;
      left: 44px;
      top: 44px;
      width: 50px;
      height: 50px;
      border-radius: 50%;
      background: radial-gradient(circle at 35% 30%, #d5fbff, #42dfff 46%, #126ca6 100%);
      box-shadow: 0 0 18px rgba(71, 234, 255, 0.7);
      transform: translate(0, 0);
    }

    .fireBtn {
      position: absolute;
      right: 20px;
      bottom: calc(34px + env(safe-area-inset-bottom));
      width: 102px;
      height: 102px;
      border-radius: 50%;
      border: 1px solid rgba(255, 119, 177, 0.62);
      background: radial-gradient(circle at 35% 30%, #ffd6eb, #ff4f95 44%, #7d154d 100%);
      color: white;
      font-weight: 900;
      letter-spacing: 1px;
      box-shadow: 0 0 24px rgba(255, 79, 149, 0.45);
      pointer-events: auto;
      user-select: none;
      -webkit-user-select: none;
      touch-action: none;
    }

    .fireBtn:active { transform: scale(0.94); }

    .mobileHint { display: none; }

    @media (max-width: 700px) {
      body {
        align-items: stretch;
        background: #02030a;
      }
      #gameContainer {
        width: 100vw;
        height: 100dvh;
        max-width: none;
        max-height: none;
        aspect-ratio: auto;
        border-radius: 0;
      }
      canvas { border-radius: 0; border: 0; }
      #startScreen, #gameOverScreen { padding: 28px 20px 180px; }
      h1 { font-size: clamp(34px, 11vw, 52px); }
      .controls { display: none; }
      .mobileHint {
        display: block;
        margin-top: 18px;
        color: #9fefff;
        font-size: 14px;
      }
      .mobileControls { display: none; }
    }

    /* Show touch controls only when JavaScript confirms a phone/tablet. */
    body.mobile-device .mobileControls { display: block; }
    body.mobile-device { overscroll-behavior: none; }
    body.mobile-device .controls { display: none; }
    body.mobile-device .mobileHint {
      display: block;
      margin-top: 18px;
      color: #9fefff;
      font-size: 14px;
    }
  </style>
</head>
<body>
<div id="gameContainer">
  <canvas id="game" width="600" height="800"></canvas>

  <div id="startScreen">
    <h1>SPACE RAIDERS</h1>
    <div class="subtitle">Defend the galaxy.<br>Every 3rd wave brings a new boss.</div>
    <div class="best" id="startBest">HIGH SCORE: 0</div>
    <button id="startBtn">START MISSION</button>
    <div class="controls">
      WASD / Arrow Keys to move<br>
      Hold SPACE to fire
    </div>
    <div class="mobileHint">Drag the left stick to move • Hold FIRE to shoot</div>
  </div>

  <div id="gameOverScreen">
    <h1>GAME OVER</h1>
    <div class="subtitle" id="finalScore">Score: 0</div>
    <div class="best" id="finalBest">HIGH SCORE: 0</div>
    <button id="restartBtn">PLAY AGAIN</button>
  </div>

  <div class="mobileControls" id="mobileControls">
    <div class="joystick" id="joystick"><div class="stick" id="stick"></div></div>
    <button class="fireBtn" id="fireBtn" aria-label="Fire">FIRE</button>
  </div>
</div>

<script>
// Only enable on-screen controls on actual touch-first mobile/tablet devices.
const isMobileDevice = (() => {
  const ua = navigator.userAgent || "";
  const phoneOrTabletUA = /Android|iPhone|iPad|iPod|Mobile/i.test(ua);
  const iPadOS = navigator.platform === "MacIntel" && navigator.maxTouchPoints > 1;
  return phoneOrTabletUA || iPadOS;
})();

if (isMobileDevice) document.body.classList.add("mobile-device");

const canvas = document.getElementById("game");
const ctx = canvas.getContext("2d");
const startScreen = document.getElementById("startScreen");
const gameOverScreen = document.getElementById("gameOverScreen");
const startBtn = document.getElementById("startBtn");
const restartBtn = document.getElementById("restartBtn");
const finalScore = document.getElementById("finalScore");
const finalBest = document.getElementById("finalBest");
const startBest = document.getElementById("startBest");
const joystick = document.getElementById("joystick");
const stick = document.getElementById("stick");
const fireBtn = document.getElementById("fireBtn");

const keys = {};
const touchMove = { x: 0, y: 0 };
let touchFiring = false;
let activeJoystickPointer = null;
let running = false;
let score = 0;
let frame = 0;
let highScore = Number(localStorage.getItem("spaceRaidersHighScore") || 0);

let wave = 1;
let waveKills = 0;
let waveTarget = 8;
let waveDelay = 0;
let showingWaveText = 0;
let lastBossDefeatedName = "";

let bossActive = false;
let boss = null;

const player = {
  x: 280,
  y: 690,
  width: 44,
  height: 58,
  speed: 6,
  health: 100,
  cooldown: 0,
  invincible: 0,
  rapidFire: 0,
  tripleShot: 0,
  shield: 0
};

const stars = [];
const bullets = [];
const enemies = [];
const enemyBullets = [];
const asteroids = [];
const particles = [];
const powerUps = [];

const bossTypes = [
  {
    id: "red",
    name: "VOID DESTROYER",
    colors: ["#ff7db7", "#b62679", "#471052"],
    glow: "#ff2f77",
    core: "#ffd5ef",
    coreDark: "#7b165b",
    ability: "Spread + aimed fire"
  },
  {
    id: "blue",
    name: "NEBULA GUARDIAN",
    colors: ["#8eeaff", "#2688d9", "#143772"],
    glow: "#32c8ff",
    core: "#e3fbff",
    coreDark: "#155b9a",
    ability: "Energy shield"
  },
  {
    id: "purple",
    name: "PHANTOM WRAITH",
    colors: ["#e89cff", "#8f43db", "#34125e"],
    glow: "#c85cff",
    core: "#f5dcff",
    coreDark: "#7020a8",
    ability: "Teleport strike"
  },
  {
    id: "green",
    name: "SWARM EMPEROR",
    colors: ["#b9ff92", "#46b84a", "#155522"],
    glow: "#62ff6e",
    core: "#e9ffe2",
    coreDark: "#238c35",
    ability: "Summons raiders"
  },
  {
    id: "orange",
    name: "SOLAR TYRANT",
    colors: ["#ffd27c", "#ff7a24", "#7b2d09"],
    glow: "#ff9a38",
    core: "#fff1c2",
    coreDark: "#b7490f",
    ability: "Radial solar burst"
  }
];

for (let i = 0; i < 130; i++) {
  stars.push({
    x: Math.random() * canvas.width,
    y: Math.random() * canvas.height,
    size: Math.random() * 2 + 0.5,
    speed: Math.random() * 2 + 0.5,
    alpha: Math.random() * 0.7 + 0.3
  });
}

function updateHighScore(save = true) {
  if (score > highScore) {
    highScore = score;
    if (save) localStorage.setItem("spaceRaidersHighScore", String(highScore));
  }
}

function updateMenuHighScore() {
  startBest.textContent = "HIGH SCORE: " + highScore;
  finalBest.textContent = "HIGH SCORE: " + highScore;
}
updateMenuHighScore();

document.addEventListener("keydown", e => {
  keys[e.key.toLowerCase()] = true;
  if (e.code === "Space") {
    keys.space = true;
    e.preventDefault();
  }
});

document.addEventListener("keyup", e => {
  keys[e.key.toLowerCase()] = false;
  if (e.code === "Space") keys.space = false;
});

startBtn.addEventListener("click", startGame);
restartBtn.addEventListener("click", startGame);

function resetJoystick() {
  touchMove.x = 0;
  touchMove.y = 0;
  if (stick) stick.style.transform = "translate(0px, 0px)";
}

function updateJoystickFromPointer(e) {
  if (!joystick || !stick) return;
  const rect = joystick.getBoundingClientRect();
  const cx = rect.left + rect.width / 2;
  const cy = rect.top + rect.height / 2;
  let dx = e.clientX - cx;
  let dy = e.clientY - cy;
  const max = rect.width * 0.31;
  const mag = Math.hypot(dx, dy) || 1;
  if (mag > max) {
    dx = dx / mag * max;
    dy = dy / mag * max;
  }
  touchMove.x = dx / max;
  touchMove.y = dy / max;
  stick.style.transform = `translate(${dx}px, ${dy}px)`;
}

if (joystick) {
  joystick.addEventListener("pointerdown", e => {
    activeJoystickPointer = e.pointerId;
    joystick.setPointerCapture?.(e.pointerId);
    updateJoystickFromPointer(e);
  });
  joystick.addEventListener("pointermove", e => {
    if (e.pointerId === activeJoystickPointer) updateJoystickFromPointer(e);
  });
  const endStick = e => {
    if (e.pointerId === activeJoystickPointer) {
      activeJoystickPointer = null;
      resetJoystick();
    }
  };
  joystick.addEventListener("pointerup", endStick);
  joystick.addEventListener("pointercancel", endStick);
}

if (fireBtn) {
  fireBtn.addEventListener("pointerdown", e => {
    touchFiring = true;
    fireBtn.setPointerCapture?.(e.pointerId);
    e.preventDefault();
  });
  const stopFire = () => { touchFiring = false; };
  fireBtn.addEventListener("pointerup", stopFire);
  fireBtn.addEventListener("pointercancel", stopFire);
  fireBtn.addEventListener("pointerleave", e => { if (e.buttons === 0) stopFire(); });
}

window.addEventListener("blur", () => {
  touchFiring = false;
  resetJoystick();
});

function startGame() {
  running = true;
  score = 0;
  frame = 0;
  wave = 1;
  waveKills = 0;
  waveTarget = 8;
  waveDelay = 0;
  showingWaveText = 120;
  lastBossDefeatedName = "";

  bossActive = false;
  boss = null;

  player.x = canvas.width / 2 - player.width / 2;
  player.y = 690;
  player.health = 100;
  player.cooldown = 0;
  player.invincible = 0;
  player.rapidFire = 0;
  player.tripleShot = 0;
  player.shield = 0;

  bullets.length = 0;
  enemies.length = 0;
  enemyBullets.length = 0;
  asteroids.length = 0;
  particles.length = 0;
  powerUps.length = 0;

  startScreen.style.display = "none";
  gameOverScreen.style.display = "none";
}

function endGame() {
  running = false;
  updateHighScore(true);
  finalScore.textContent = "Score: " + score + (score >= highScore && score > 0 ? " — NEW BEST!" : "");
  updateMenuHighScore();
  gameOverScreen.style.display = "flex";
}

function updateStars() {
  stars.forEach(star => {
    star.y += star.speed;
    if (star.y > canvas.height) {
      star.y = -5;
      star.x = Math.random() * canvas.width;
    }
    ctx.globalAlpha = star.alpha;
    ctx.fillStyle = "white";
    ctx.fillRect(star.x, star.y, star.size, star.size);
  });
  ctx.globalAlpha = 1;
}

function drawPlayer() {
  const x = player.x;
  const y = player.y;
  ctx.save();

  if (player.invincible > 0 && Math.floor(player.invincible / 5) % 2 === 0) {
    ctx.globalAlpha = 0.35;
  }

  if (player.shield > 0) {
    ctx.strokeStyle = "#6effff";
    ctx.lineWidth = 3;
    ctx.shadowColor = "#6effff";
    ctx.shadowBlur = 18;
    ctx.beginPath();
    ctx.arc(x + 22, y + 30, 38, 0, Math.PI * 2);
    ctx.stroke();
  }

  ctx.shadowColor = "#47eaff";
  ctx.shadowBlur = 12;
  ctx.fillStyle = "#1683b8";

  ctx.beginPath();
  ctx.moveTo(x + 20, y + 22);
  ctx.lineTo(x - 8, y + 53);
  ctx.lineTo(x + 15, y + 48);
  ctx.closePath();
  ctx.fill();

  ctx.beginPath();
  ctx.moveTo(x + 24, y + 22);
  ctx.lineTo(x + 52, y + 53);
  ctx.lineTo(x + 29, y + 48);
  ctx.closePath();
  ctx.fill();

  const gradient = ctx.createLinearGradient(x, y, x + 44, y + 58);
  gradient.addColorStop(0, "#d8fbff");
  gradient.addColorStop(0.45, "#38dfff");
  gradient.addColorStop(1, "#1660a8");
  ctx.fillStyle = gradient;

  ctx.beginPath();
  ctx.moveTo(x + 22, y);
  ctx.lineTo(x + 7, y + 48);
  ctx.lineTo(x + 22, y + 42);
  ctx.lineTo(x + 37, y + 48);
  ctx.closePath();
  ctx.fill();

  ctx.fillStyle = "#163472";
  ctx.beginPath();
  ctx.ellipse(x + 22, y + 22, 6, 11, 0, 0, Math.PI * 2);
  ctx.fill();

  ctx.shadowColor = "#ff7b32";
  ctx.shadowBlur = 15;
  ctx.fillStyle = "#ffd24a";
  ctx.beginPath();
  ctx.moveTo(x + 15, y + 46);
  ctx.lineTo(x + 19, y + 67 + Math.random() * 7);
  ctx.lineTo(x + 23, y + 46);
  ctx.fill();

  ctx.beginPath();
  ctx.moveTo(x + 23, y + 46);
  ctx.lineTo(x + 27, y + 67 + Math.random() * 7);
  ctx.lineTo(x + 31, y + 46);
  ctx.fill();

  ctx.restore();
}

function addBullet(x, y, dx = 0) {
  bullets.push({ x, y, width: 4, height: 22, speed: 11, dx, damage: 1 });
}

function shootPlayer() {
  if (player.cooldown > 0) return;
  if (player.tripleShot > 0) {
    addBullet(player.x + 8, player.y + 5, -2.2);
    addBullet(player.x + 20, player.y, 0);
    addBullet(player.x + 32, player.y + 5, 2.2);
  } else {
    addBullet(player.x + 8, player.y + 5);
    addBullet(player.x + 32, player.y + 5);
  }
  player.cooldown = player.rapidFire > 0 ? 5 : 10;
}

function updatePlayer() {
  let moveX = 0;
  let moveY = 0;
  if (keys.a || keys.arrowleft) moveX -= 1;
  if (keys.d || keys.arrowright) moveX += 1;
  if (keys.w || keys.arrowup) moveY -= 1;
  if (keys.s || keys.arrowdown) moveY += 1;
  moveX += touchMove.x;
  moveY += touchMove.y;
  const len = Math.hypot(moveX, moveY);
  if (len > 1) { moveX /= len; moveY /= len; }
  player.x += moveX * player.speed;
  player.y += moveY * player.speed;
  if (keys.space || touchFiring) shootPlayer();

  player.x = Math.max(8, Math.min(canvas.width - player.width - 8, player.x));
  player.y = Math.max(105, Math.min(canvas.height - player.height - 12, player.y));

  if (player.cooldown > 0) player.cooldown--;
  if (player.invincible > 0) player.invincible--;
  if (player.rapidFire > 0) player.rapidFire--;
  if (player.tripleShot > 0) player.tripleShot--;
}

function drawPlayerBullets() {
  for (let i = bullets.length - 1; i >= 0; i--) {
    const b = bullets[i];
    b.y -= b.speed;
    b.x += b.dx || 0;

    ctx.save();
    ctx.shadowColor = "#37ff9d";
    ctx.shadowBlur = 15;
    const laserGradient = ctx.createLinearGradient(b.x, b.y, b.x, b.y + b.height);
    laserGradient.addColorStop(0, "white");
    laserGradient.addColorStop(1, "#00ff88");
    ctx.fillStyle = laserGradient;
    ctx.fillRect(b.x, b.y, b.width, b.height);
    ctx.restore();

    if (b.y < -30 || b.x < -20 || b.x > canvas.width + 20) bullets.splice(i, 1);
  }
}

function spawnEnemy(custom = {}) {
  const speedBoost = Math.max(0, wave - 1) * 0.32;
  enemies.push({
    x: custom.x ?? Math.random() * 520 + 20,
    y: custom.y ?? -70,
    width: custom.width ?? 52,
    height: custom.height ?? 48,
    speed: custom.speed ?? (2.5 + Math.random() * 1.2 + speedBoost),
    cooldown: custom.cooldown ?? (55 + Math.random() * 80),
    hp: custom.hp ?? (wave >= 5 ? 2 : 1),
    summoned: custom.summoned ?? false
  });
}

function drawEnemy(enemy) {
  const x = enemy.x;
  const y = enemy.y;
  ctx.save();
  ctx.shadowColor = enemy.summoned ? "#72ff79" : "#ff3366";
  ctx.shadowBlur = 12;
  ctx.fillStyle = enemy.summoned ? "#1d7d36" : "#8e173f";

  ctx.beginPath();
  ctx.moveTo(x + 26, y + 17);
  ctx.lineTo(x - 8, y);
  ctx.lineTo(x + 7, y + 38);
  ctx.closePath();
  ctx.fill();

  ctx.beginPath();
  ctx.moveTo(x + 26, y + 17);
  ctx.lineTo(x + 60, y);
  ctx.lineTo(x + 45, y + 38);
  ctx.closePath();
  ctx.fill();

  const gradient = ctx.createLinearGradient(x, y, x + 52, y + 48);
  if (enemy.summoned) {
    gradient.addColorStop(0, "#baffb5");
    gradient.addColorStop(0.5, "#46d960");
    gradient.addColorStop(1, "#17652b");
  } else {
    gradient.addColorStop(0, "#ff88aa");
    gradient.addColorStop(0.5, "#ff2f67");
    gradient.addColorStop(1, "#7e1237");
  }
  ctx.fillStyle = gradient;
  ctx.beginPath();
  ctx.moveTo(x + 26, y + 48);
  ctx.lineTo(x + 10, y + 6);
  ctx.lineTo(x + 26, y + 14);
  ctx.lineTo(x + 42, y + 6);
  ctx.closePath();
  ctx.fill();

  ctx.fillStyle = "#ffd5df";
  ctx.beginPath();
  ctx.arc(x + 26, y + 27, 5, 0, Math.PI * 2);
  ctx.fill();
  ctx.restore();
}

function updateEnemies() {
  for (let i = enemies.length - 1; i >= 0; i--) {
    const enemy = enemies[i];
    enemy.y += enemy.speed;
    enemy.cooldown--;
    drawEnemy(enemy);

    if (enemy.cooldown <= 0 && enemy.y > 20) {
      enemyBullets.push({
        x: enemy.x + 26,
        y: enemy.y + 42,
        dx: 0,
        dy: 4.2 + Math.min(wave, 15) * 0.22,
        radius: enemy.summoned ? 5 : 6,
        color: enemy.summoned ? "#72ff79" : "#ff405c"
      });
      enemy.cooldown = 90 + Math.random() * 70;
    }

    if (enemy.y > canvas.height + 70) enemies.splice(i, 1);
  }
}

function maybeDropPowerUp(x, y) {
  const roll = Math.random();
  let type = null;
  if (roll < 0.05) type = "heal";
  else if (roll < 0.12) type = "shield";
  else if (roll < 0.20) type = "triple";
  else if (roll < 0.30) type = "rapid";
  if (!type) return;

  powerUps.push({ x, y, width: 28, height: 28, speed: 2.2, type, rotation: 0 });
}

function drawPowerUps() {
  for (let i = powerUps.length - 1; i >= 0; i--) {
    const p = powerUps[i];
    p.y += p.speed;
    p.rotation += 0.04;

    ctx.save();
    ctx.translate(p.x + 14, p.y + 14);
    ctx.rotate(p.rotation);

    let color = "#ffffff";
    let symbol = "?";
    if (p.type === "rapid") { color = "#ffe45c"; symbol = "⚡"; }
    if (p.type === "triple") { color = "#b86cff"; symbol = "3"; }
    if (p.type === "shield") { color = "#5cecff"; symbol = "S"; }
    if (p.type === "heal") { color = "#5cff87"; symbol = "+"; }

    ctx.shadowColor = color;
    ctx.shadowBlur = 18;
    ctx.fillStyle = color;
    ctx.beginPath();
    ctx.arc(0, 0, 13, 0, Math.PI * 2);
    ctx.fill();

    ctx.fillStyle = "#11152c";
    ctx.font = "bold 16px Arial";
    ctx.textAlign = "center";
    ctx.textBaseline = "middle";
    ctx.fillText(symbol, 0, 1);
    ctx.restore();

    if (p.y > canvas.height + 40) powerUps.splice(i, 1);
  }
}

function collectPowerUp(type) {
  if (type === "rapid") player.rapidFire = 60 * 8;
  if (type === "triple") player.tripleShot = 60 * 10;
  if (type === "shield") player.shield = 1;
  if (type === "heal") player.health = Math.min(100, player.health + 30);
}

function getBossTypeForWave(currentWave) {
  const bossNumber = Math.max(1, Math.floor(currentWave / 3));
  return bossTypes[(bossNumber - 1) % bossTypes.length];
}

function spawnBoss() {
  bossActive = true;
  enemies.length = 0;
  enemyBullets.length = 0;
  asteroids.length = 0;

  const bossNumber = Math.max(1, Math.floor(wave / 3));
  const type = getBossTypeForWave(wave);
  const cycle = Math.floor((bossNumber - 1) / bossTypes.length);
  const hp = 72 + bossNumber * 18 + cycle * 20;

  boss = {
    x: canvas.width / 2 - 90,
    y: -150,
    width: 180,
    height: 110,
    hp,
    maxHp: hp,
    direction: 1,
    entering: true,
    shootTimer: 0,
    attackMode: 0,
    abilityTimer: 0,
    shieldTimer: 0,
    shieldActive: false,
    teleportFlash: 0,
    type,
    bossNumber,
    speed: 2.4 + Math.min(bossNumber * 0.14, 1.8)
  };
}

function drawBoss() {
  if (!boss) return;
  const x = boss.x;
  const y = boss.y;
  const type = boss.type;

  ctx.save();

  if (boss.teleportFlash > 0 && Math.floor(boss.teleportFlash / 3) % 2 === 0) {
    ctx.globalAlpha = 0.45;
  }

  ctx.shadowColor = type.glow;
  ctx.shadowBlur = 28;

  const g = ctx.createLinearGradient(x, y, x + boss.width, y + boss.height);
  g.addColorStop(0, type.colors[0]);
  g.addColorStop(0.45, type.colors[1]);
  g.addColorStop(1, type.colors[2]);

  ctx.fillStyle = g;
  ctx.beginPath();
  ctx.moveTo(x + 90, y + 100);
  ctx.lineTo(x + 10, y + 25);
  ctx.lineTo(x + 55, y + 35);
  ctx.lineTo(x + 90, y);
  ctx.lineTo(x + 125, y + 35);
  ctx.lineTo(x + 170, y + 25);
  ctx.closePath();
  ctx.fill();

  ctx.fillStyle = type.core;
  ctx.beginPath();
  ctx.arc(x + 90, y + 46, 17, 0, Math.PI * 2);
  ctx.fill();

  ctx.fillStyle = type.coreDark;
  ctx.beginPath();
  ctx.arc(x + 90, y + 46, 9, 0, Math.PI * 2);
  ctx.fill();

  if (boss.type.id === "blue" && boss.shieldActive) {
    ctx.strokeStyle = "#bdf7ff";
    ctx.lineWidth = 5;
    ctx.shadowColor = "#55dfff";
    ctx.shadowBlur = 30;
    ctx.beginPath();
    ctx.ellipse(x + 90, y + 55, 112, 78, 0, 0, Math.PI * 2);
    ctx.stroke();
  }

  ctx.restore();
}

function pushEnemyBullet(x, y, dx, dy, radius = 7, color = null) {
  enemyBullets.push({
    x, y, dx, dy, radius,
    color: color || (boss ? boss.type.glow : "#ff405c")
  });
}

function bossFireSpread() {
  if (!boss) return;
  for (let angle = -0.8; angle <= 0.8; angle += 0.4) {
    pushEnemyBullet(
      boss.x + boss.width / 2,
      boss.y + boss.height - 10,
      Math.sin(angle) * 3.2,
      Math.cos(angle) * 4.5
    );
  }
}

function bossFireAim(count = 3, speed = 4.6) {
  if (!boss) return;
  const sx = boss.x + boss.width / 2;
  const sy = boss.y + boss.height;
  const px = player.x + player.width / 2;
  const py = player.y + player.height / 2;
  const angle = Math.atan2(py - sy, px - sx);

  const spread = count === 1 ? [0] : Array.from({length: count}, (_, i) => (i - (count - 1) / 2) * 0.16);
  spread.forEach(offset => {
    pushEnemyBullet(sx, sy, Math.cos(angle + offset) * speed, Math.sin(angle + offset) * speed);
  });
}

function bossFireCircle() {
  if (!boss) return;
  const sx = boss.x + boss.width / 2;
  const sy = boss.y + boss.height / 2;
  for (let i = 0; i < 16; i++) {
    const angle = (i / 16) * Math.PI * 2;
    pushEnemyBullet(sx, sy, Math.cos(angle) * 4.0, Math.sin(angle) * 4.0, 7, "#ffad42");
  }
}

function summonRaiders() {
  if (!boss) return;
  spawnEnemy({
    x: Math.max(20, boss.x + 25),
    y: boss.y + 70,
    speed: 3.0,
    hp: 2,
    cooldown: 45,
    summoned: true
  });
  spawnEnemy({
    x: Math.min(canvas.width - 75, boss.x + boss.width - 70),
    y: boss.y + 70,
    speed: 3.0,
    hp: 2,
    cooldown: 55,
    summoned: true
  });
}

function teleportBoss() {
  if (!boss) return;
  createExplosion(boss.x + boss.width / 2, boss.y + boss.height / 2, boss.type.glow);
  boss.x = 30 + Math.random() * (canvas.width - boss.width - 60);
  boss.teleportFlash = 24;
  bossFireAim(5, 5.0);
}

function updateBoss() {
  if (!boss) return;

  if (boss.teleportFlash > 0) boss.teleportFlash--;

  if (boss.entering) {
    boss.y += 2.4;
    if (boss.y >= 105) {
      boss.y = 105;
      boss.entering = false;
    }
  } else {
    boss.x += boss.direction * boss.speed;
    if (boss.x <= 20 || boss.x + boss.width >= canvas.width - 20) {
      boss.direction *= -1;
    }

    boss.shootTimer++;
    boss.abilityTimer++;

    switch (boss.type.id) {
      case "red":
        if (boss.shootTimer > 52) {
          if (boss.attackMode % 2 === 0) bossFireSpread();
          else bossFireAim(3, 4.7);
          boss.attackMode++;
          boss.shootTimer = 0;
        }
        break;

      case "blue":
        if (boss.shootTimer > 64) {
          bossFireAim(3, 4.4);
          boss.shootTimer = 0;
        }
        if (boss.abilityTimer > 210) {
          boss.shieldActive = true;
          boss.shieldTimer = 100;
          boss.abilityTimer = 0;
        }
        if (boss.shieldActive) {
          boss.shieldTimer--;
          if (boss.shieldTimer <= 0) boss.shieldActive = false;
        }
        break;

      case "purple":
        if (boss.shootTimer > 68) {
          bossFireSpread();
          boss.shootTimer = 0;
        }
        if (boss.abilityTimer > 170) {
          teleportBoss();
          boss.abilityTimer = 0;
        }
        break;

      case "green":
        if (boss.shootTimer > 62) {
          bossFireAim(2, 4.4);
          boss.shootTimer = 0;
        }
        if (boss.abilityTimer > 190) {
          summonRaiders();
          boss.abilityTimer = 0;
        }
        break;

      case "orange":
        if (boss.shootTimer > 55) {
          bossFireAim(3, 4.8);
          boss.shootTimer = 0;
        }
        if (boss.abilityTimer > 150) {
          bossFireCircle();
          boss.abilityTimer = 0;
        }
        break;
    }
  }

  drawBoss();
}

function drawEnemyBullets() {
  for (let i = enemyBullets.length - 1; i >= 0; i--) {
    const b = enemyBullets[i];
    b.x += b.dx || 0;
    b.y += b.dy;

    const color = b.color || "#ff405c";
    ctx.save();
    ctx.shadowColor = color;
    ctx.shadowBlur = 16;
    ctx.fillStyle = color;
    ctx.beginPath();
    ctx.arc(b.x, b.y, b.radius, 0, Math.PI * 2);
    ctx.fill();
    ctx.restore();

    if (b.y > canvas.height + 30 || b.y < -30 || b.x < -30 || b.x > canvas.width + 30) {
      enemyBullets.splice(i, 1);
    }
  }
}

function spawnAsteroid() {
  const size = 35 + Math.random() * 30;
  asteroids.push({
    x: Math.random() * (canvas.width - size),
    y: -size,
    width: size,
    height: size,
    speed: 1.7 + Math.random() * 1.8,
    rotation: Math.random() * Math.PI,
    rotationSpeed: (Math.random() - 0.5) * 0.035
  });
}

function drawAsteroids() {
  for (let i = asteroids.length - 1; i >= 0; i--) {
    const a = asteroids[i];
    a.y += a.speed;
    a.rotation += a.rotationSpeed;

    ctx.save();
    ctx.translate(a.x + a.width / 2, a.y + a.height / 2);
    ctx.rotate(a.rotation);

    const radius = a.width / 2;
    const grad = ctx.createRadialGradient(-8, -8, 3, 0, 0, radius);
    grad.addColorStop(0, "#aaaab8");
    grad.addColorStop(1, "#454552");

    ctx.fillStyle = grad;
    ctx.beginPath();
    for (let p = 0; p < 10; p++) {
      const angle = p / 10 * Math.PI * 2;
      const variation = p % 2 === 0 ? 1 : 0.78;
      const px = Math.cos(angle) * radius * variation;
      const py = Math.sin(angle) * radius * variation;
      if (p === 0) ctx.moveTo(px, py);
      else ctx.lineTo(px, py);
    }
    ctx.closePath();
    ctx.fill();
    ctx.restore();

    if (a.y > canvas.height + 80) asteroids.splice(i, 1);
  }
}

function createExplosion(x, y, color = null) {
  for (let i = 0; i < 28; i++) {
    particles.push({
      x, y,
      dx: (Math.random() - 0.5) * 8,
      dy: (Math.random() - 0.5) * 8,
      life: 35 + Math.random() * 15,
      radius: Math.random() * 5 + 2,
      color
    });
  }
}

function updateParticles() {
  for (let i = particles.length - 1; i >= 0; i--) {
    const p = particles[i];
    p.x += p.dx;
    p.y += p.dy;
    p.dx *= 0.97;
    p.dy *= 0.97;
    p.life--;

    ctx.globalAlpha = Math.max(0, p.life / 45);
    if (p.color) ctx.fillStyle = p.color;
    else if (p.life > 30) ctx.fillStyle = "#fff6b0";
    else if (p.life > 15) ctx.fillStyle = "#ff9a26";
    else ctx.fillStyle = "#ff334f";

    ctx.beginPath();
    ctx.arc(p.x, p.y, p.radius, 0, Math.PI * 2);
    ctx.fill();
    ctx.globalAlpha = 1;

    if (p.life <= 0) particles.splice(i, 1);
  }
}

function rectCollision(a, b) {
  return (
    a.x < b.x + b.width &&
    a.x + a.width > b.x &&
    a.y < b.y + b.height &&
    a.y + a.height > b.y
  );
}

function bulletHitsPlayer(b) {
  return (
    b.x + b.radius > player.x &&
    b.x - b.radius < player.x + player.width &&
    b.y + b.radius > player.y &&
    b.y - b.radius < player.y + player.height
  );
}

function damagePlayer(amount) {
  if (player.invincible > 0) return;

  if (player.shield > 0) {
    player.shield = 0;
    player.invincible = 25;
    createExplosion(player.x + player.width / 2, player.y + player.height / 2, "#6effff");
    return;
  }

  player.health -= amount;
  player.invincible = 45;
  createExplosion(player.x + player.width / 2, player.y + player.height / 2);

  if (player.health <= 0) {
    player.health = 0;
    endGame();
  }
}

function enemyDestroyed(enemyIndex) {
  const enemy = enemies[enemyIndex];
  createExplosion(enemy.x + enemy.width / 2, enemy.y + enemy.height / 2);
  maybeDropPowerUp(enemy.x + enemy.width / 2 - 14, enemy.y + enemy.height / 2 - 14);
  enemies.splice(enemyIndex, 1);

  score += enemy.summoned ? 150 : 100;
  updateHighScore(false);

  if (!bossActive && !enemy.summoned) {
    waveKills++;
    if (waveKills >= waveTarget && waveDelay <= 0) waveDelay = 100;
  }
}

function beginWave(targetWave) {
  wave = targetWave;
  waveKills = 0;
  waveDelay = 0;
  enemyBullets.length = 0;
  asteroids.length = 0;
  enemies.length = 0;

  if (wave % 3 === 0) {
    showingWaveText = 150;
    spawnBoss();
  } else {
    waveTarget = 7 + wave * 3;
    showingWaveText = 120;
  }
}

function nextWave() {
  beginWave(wave + 1);
}

function bossDefeated() {
  if (!boss) return;
  const defeatedBoss = boss;
  lastBossDefeatedName = defeatedBoss.type.name;

  createExplosion(
    defeatedBoss.x + defeatedBoss.width / 2,
    defeatedBoss.y + defeatedBoss.height / 2,
    defeatedBoss.type.glow
  );

  score += 3000 + defeatedBoss.bossNumber * 500;
  updateHighScore(false);

  powerUps.push({
    x: defeatedBoss.x + defeatedBoss.width / 2 - 14,
    y: defeatedBoss.y + defeatedBoss.height / 2,
    width: 28,
    height: 28,
    speed: 2.2,
    type: "heal",
    rotation: 0
  });

  boss = null;
  bossActive = false;
  enemyBullets.length = 0;
  enemies.length = 0;
  asteroids.length = 0;

  waveKills = 0;
  waveTarget = 7 + (wave + 1) * 3;
  waveDelay = 110;
  showingWaveText = 150;
}

function checkCollisions() {
  for (let i = bullets.length - 1; i >= 0; i--) {
    let used = false;

    if (bossActive && boss && rectCollision(bullets[i], boss)) {
      if (!(boss.type.id === "blue" && boss.shieldActive)) {
        boss.hp -= bullets[i].damage;
      }
      bullets.splice(i, 1);
      used = true;
      if (boss && boss.hp <= 0) bossDefeated();
    }

    if (used) continue;

    for (let j = enemies.length - 1; j >= 0; j--) {
      if (rectCollision(bullets[i], enemies[j])) {
        enemies[j].hp--;
        bullets.splice(i, 1);

        if (enemies[j].hp <= 0) enemyDestroyed(j);
        used = true;
        break;
      }
    }

    if (used) continue;

    for (let j = asteroids.length - 1; j >= 0; j--) {
      if (rectCollision(bullets[i], asteroids[j])) {
        createExplosion(
          asteroids[j].x + asteroids[j].width / 2,
          asteroids[j].y + asteroids[j].height / 2
        );
        bullets.splice(i, 1);
        asteroids.splice(j, 1);
        score += 50;
        updateHighScore(false);
        break;
      }
    }
  }

  for (let i = enemyBullets.length - 1; i >= 0; i--) {
    if (bulletHitsPlayer(enemyBullets[i])) {
      enemyBullets.splice(i, 1);
      damagePlayer(bossActive ? 15 : 20);
    }
  }

  for (let i = asteroids.length - 1; i >= 0; i--) {
    if (rectCollision(asteroids[i], player)) {
      asteroids.splice(i, 1);
      damagePlayer(30);
    }
  }

  for (let i = enemies.length - 1; i >= 0; i--) {
    if (rectCollision(enemies[i], player)) {
      enemies.splice(i, 1);
      damagePlayer(30);
    }
  }

  if (bossActive && boss && rectCollision(boss, player)) damagePlayer(50);

  for (let i = powerUps.length - 1; i >= 0; i--) {
    if (rectCollision(powerUps[i], player)) {
      collectPowerUp(powerUps[i].type);
      powerUps.splice(i, 1);
    }
  }
}

function drawHUD() {
  ctx.save();

  ctx.fillStyle = "white";
  ctx.font = "bold 18px Arial";
  ctx.fillText("SCORE  " + score, 20, 31);

  ctx.font = "bold 14px Arial";
  ctx.fillStyle = "#ffe96b";
  ctx.fillText("BEST  " + Math.max(highScore, score), 20, 53);

  ctx.fillStyle = "#cdd7ff";
  ctx.fillText("WAVE  " + wave, 20, 75);

  ctx.fillStyle = "white";
  ctx.font = "bold 15px Arial";
  ctx.fillText("SHIELD", 405, 32);

  ctx.fillStyle = "#20243b";
  ctx.fillRect(470, 19, 105, 18);

  const healthWidth = 101 * (player.health / 100);
  const healthGradient = ctx.createLinearGradient(470, 0, 575, 0);
  healthGradient.addColorStop(0, "#28ffb2");
  healthGradient.addColorStop(1, "#48b8ff");

  ctx.fillStyle = healthGradient;
  ctx.fillRect(472, 21, healthWidth, 14);
  ctx.strokeStyle = "#bdeeff";
  ctx.strokeRect(470, 19, 105, 18);

  let statusY = 99;
  ctx.font = "bold 13px Arial";

  if (player.rapidFire > 0) {
    ctx.fillStyle = "#ffe45c";
    ctx.fillText("⚡ RAPID " + Math.ceil(player.rapidFire / 60) + "s", 20, statusY);
    statusY += 20;
  }

  if (player.tripleShot > 0) {
    ctx.fillStyle = "#d38cff";
    ctx.fillText("TRIPLE " + Math.ceil(player.tripleShot / 60) + "s", 20, statusY);
    statusY += 20;
  }

  if (player.shield > 0) {
    ctx.fillStyle = "#63efff";
    ctx.fillText("SHIELD READY", 20, statusY);
  }

  if (bossActive && boss) {
    ctx.fillStyle = "#1b1523";
    ctx.fillRect(100, 78, 400, 20);

    const bossWidth = 396 * Math.max(0, boss.hp / boss.maxHp);
    const bossGradient = ctx.createLinearGradient(100, 0, 500, 0);
    bossGradient.addColorStop(0, boss.type.colors[0]);
    bossGradient.addColorStop(1, boss.type.colors[1]);

    ctx.fillStyle = bossGradient;
    ctx.fillRect(102, 80, bossWidth, 16);

    ctx.strokeStyle = boss.type.glow;
    ctx.strokeRect(100, 78, 400, 20);

    ctx.fillStyle = "white";
    ctx.textAlign = "center";
    ctx.font = "bold 14px Arial";
    ctx.fillText(boss.type.name, 300, 70);

    ctx.font = "12px Arial";
    ctx.fillStyle = boss.type.core;
    ctx.fillText(boss.type.ability, 300, 115);

    if (boss.type.id === "blue" && boss.shieldActive) {
      ctx.fillStyle = "#9befff";
      ctx.fillText("ENERGY SHIELD ACTIVE", 300, 133);
    }

    ctx.textAlign = "left";
  }

  ctx.restore();
}

function drawWaveMessage() {
  if (showingWaveText <= 0) return;

  ctx.save();
  ctx.globalAlpha = Math.min(1, showingWaveText / 40);
  ctx.fillStyle = "white";
  ctx.textAlign = "center";
  ctx.shadowColor = bossActive && boss ? boss.type.glow : "#47eaff";
  ctx.shadowBlur = 20;

  if (bossActive && boss) {
    ctx.font = "bold 40px Arial";
    ctx.fillText("WARNING", canvas.width / 2, 330);
    ctx.font = "bold 24px Arial";
    ctx.fillText(boss.type.name, canvas.width / 2, 370);
    ctx.font = "bold 16px Arial";
    ctx.fillStyle = boss.type.core;
    ctx.fillText(boss.type.ability, canvas.width / 2, 402);
  } else if (lastBossDefeatedName && waveDelay > 0) {
    ctx.font = "bold 34px Arial";
    ctx.fillText("BOSS DESTROYED", canvas.width / 2, 340);
    ctx.font = "bold 18px Arial";
    ctx.fillText(lastBossDefeatedName, canvas.width / 2, 378);
  } else {
    ctx.font = "bold 40px Arial";
    ctx.fillText("WAVE " + wave, canvas.width / 2, 350);
  }

  ctx.restore();
  showingWaveText--;
}

function spawnObjects() {
  if (bossActive) return;
  if (waveDelay > 0) return;

  const enemyRate = Math.max(34, 76 - wave * 4);
  const asteroidRate = Math.max(72, 145 - wave * 6);

  if (frame % enemyRate === 0) spawnEnemy();
  if (frame % asteroidRate === 0) spawnAsteroid();
}

function updateWaveSystem() {
  if (bossActive) return;

  if (waveDelay > 0) {
    waveDelay--;
    if (waveDelay === 1) {
      lastBossDefeatedName = "";
      enemies.length = 0;
      enemyBullets.length = 0;
      asteroids.length = 0;
      nextWave();
    }
  }
}

function drawBackdrop() {
  const bg = ctx.createLinearGradient(0, 0, 0, canvas.height);
  bg.addColorStop(0, "#020313");
  bg.addColorStop(0.55, "#090a2d");
  bg.addColorStop(1, "#03030a");
  ctx.fillStyle = bg;
  ctx.fillRect(0, 0, canvas.width, canvas.height);

  const glow = ctx.createRadialGradient(300, 170, 20, 300, 170, 360);
  glow.addColorStop(0, "rgba(89, 94, 255, 0.18)");
  glow.addColorStop(1, "rgba(89, 94, 255, 0)");
  ctx.fillStyle = glow;
  ctx.fillRect(0, 0, canvas.width, canvas.height);

  ctx.save();
  ctx.globalAlpha = 0.08;
  ctx.strokeStyle = "#65dfff";
  ctx.lineWidth = 1;
  for (let y = 120; y < canvas.height; y += 80) {
    ctx.beginPath();
    ctx.moveTo(0, y);
    ctx.lineTo(canvas.width, y);
    ctx.stroke();
  }
  ctx.restore();
}

function gameLoop() {
  drawBackdrop();
  updateStars();

  if (running) {
    frame++;
    updatePlayer();
    updateWaveSystem();
    spawnObjects();

    drawPlayerBullets();

    if (bossActive) {
      updateBoss();
      if (boss && boss.type.id === "green") updateEnemies();
    } else {
      updateEnemies();
      drawAsteroids();
    }

    drawEnemyBullets();
    drawPowerUps();
    checkCollisions();
    drawPlayer();
    updateParticles();
    drawHUD();
    drawWaveMessage();
  } else {
    drawAsteroids();
    drawPowerUps();
    updateParticles();
    if (player.health > 0) drawPlayer();
  }

  requestAnimationFrame(gameLoop);
}

gameLoop();
</script>
